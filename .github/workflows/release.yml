name: Release

# GitHub Release 用の APK を F-Droid と同じビルド手順で生成する。
#
# 方針:
#   - ビルド準備は F-Droid サーバと同じ単一の情報源 (fdroid/build-recipe.sh) を使う
#   - 差異は署名だけ。F-Droid は未署名 (F-Droid 側の鍵で署名)、
#     GitHub Release はリリース鍵で署名する
#   - EAS (eas build) には依存しない。EXPO_TOKEN Secret は不要
#
# 必要な Secret:
#   ANDROID_KEYSTORE_BASE64   base64 化した keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore のパスワード
#   ANDROID_KEY_ALIAS         鍵のエイリアス
#   ANDROID_KEY_PASSWORD      鍵のパスワード
#
# 詳細は docs/release-signing.md を参照。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile

      - name: Typecheck (quality gate)
        run: pnpm typecheck

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ビルドはホストの Android SDK を直接使うため、
      # プロジェクトが要求する NDK を明示的に導入する
      # (GitHub ランナー既定の NDK は 27/29/30 で 26.1.10909125 ではない)
      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125"
          "$SDKMANAGER" --list_installed | grep -q "ndk;26.1.10909125" || {
            echo "::error::NDK 26.1.10909125 の導入に失敗しました"
            exit 1
          }
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # F-Droid の公式 firebase-stub srclib。expo-notifications の
      # com.google.firebase:firebase-messaging 依存を代替する。
      # F-Droid と同じビルドにするため、公式ビルドと同一の srclib を使う。
      - name: Fetch firebase-stub (F-Droid srclib)
        env:
          FB_STUB_SHA: ce90a956aacda17a85c60577ee443aeb83d876ef
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-stub"
          curl -fsSL "https://gitlab.com/freed-by-fdroid/firebase-stubs/-/archive/${FB_STUB_SHA}/firebase-stubs-${FB_STUB_SHA}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/firebase-stub" --strip-components=1
          test -d "$RUNNER_TEMP/firebase-stub/firebase-messaging/src"
          echo "firebase-stub を展開しました"

      # リリース署名鍵を復元する。
      # keystore は「一度作って失効しない」鍵のため Secret で管理する
      # （毎回生成すると署が変わるため、F-Droid からの更新と
      #  インストール済みアプリの更新に失敗する）。
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]   || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]  || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS:-}" ]         || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD:-}" ]      || missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::リリース署名に必要な Secret が設定されていません: ${missing[*]}"
            echo "::error::keystore は一度生成して失効させません。docs/release-signing.md の手順で作成し、"
            echo "::error::gh secret set <名前> で登録してください。"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/prepito-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::keystore の復元に失敗しました"; exit 1; }
          echo "PREPITO_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "PREPITO_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PREPITO_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PREPITO_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "keystore を復元しました: $KEYSTORE_PATH"

      # F-Droid サーバと同じスクリプトでビルド準備する（単一の情報源）。
      - name: Build preparation (shared recipe script)
        env:
          FIREBASE_STUB_DIR: ${{ runner.temp }}/firebase-stub
          PREPITO_SIGNING_MODE: release
        run: |
          set -euo pipefail
          VERCODE="$(grep -oE 'versionCode:[[:space:]]*[0-9]+' packages/app/app.config.ts | head -1 | grep -oE '[0-9]+')"
          test -n "$VERCODE" || { echo "::error::app.config.ts から versionCode を取得できません"; exit 1; }
          export VERCODE
          bash fdroid/build-recipe.sh

      # レシピと同じく Gradle ラッパーを使う（プロジェクトは Gradle 8.6 固定）
      - name: Gradle assembleRelease
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          APK_DIR="packages/app/android/app/build/outputs/apk/release"
          # 署名ありなら app-release.apk、署名なしなら app-release-unsigned.apk
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          shopt -u nullglob
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::APK が生成されていません: $APK_DIR/*.apk"
            exit 1
          fi
          APK="${APKS[0]}"
          unzip -l "$APK" > /dev/null

          # 1) 署名されていること（未署名 APK は端末にインストールできない）
          #    署名スキーム v2/v3 は META-INF/*.RSA を生成しないため、
          #    META-INF の有無ではなく apksigner で判定する
          APKSIGNER="$(ls -d "${ANDROID_HOME}/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify "$APK" > /dev/null 2>&1 \
              || { echo "::error::APK の署名検証に失敗しました（署名されていません）"; exit 1; }
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -3
            echo "OK: 署名済み（apksigner で検証）"
          else
            echo "::error::apksigner が見つかりません。署名を検証できないため Release を作成できません"
            exit 1
          fi

          # 2) package 名と versionCode が app.config.ts と一致すること
          AAPT="$(ls -d "${ANDROID_HOME}/build-tools/"*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging "$APK")"
            echo "$BADGING" | head -3
            echo "$BADGING" | grep -q "package: name='com.prepito.app'" \
              || { echo "::error::package 名が com.prepito.app ではありません"; exit 1; }
            VERSIONCODE="$(grep -oE 'versionCode:[[:space:]]*[0-9]+' packages/app/app.config.ts | head -1 | grep -oE '[0-9]+')"
            echo "$BADGING" | grep -q "versionCode='${VERSIONCODE}'" \
              || { echo "::error::versionCode が app.config.ts (${VERSIONCODE}) と一致しません"; exit 1; }
            echo "OK: package / versionCode 一致"
          else
            echo "::warning::aapt が見つからないため package / versionCode の検証をスキップします"
          fi

          # 3) Google Play Services のクラスが含まれないこと
          #    （F-Droid ビルドと同じ依存構成であることを担保する）
          if unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings | grep -q 'com/google/android/gms'; then
            echo "::error::APK に com/google/android/gms のクラスが含まれています"
            exit 1
          fi
          echo "OK: GMS クラスなし"

          mkdir -p build-output
          cp "$APK" build-output/Prepito-android.apk
          ls -lh build-output/Prepito-android.apk

      - name: Determine release tag and version
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [ -z "$INPUT_VERSION" ]; then
              TAG="v$(date +%Y.%m.%d-%H%M)"
            else
              TAG="v${INPUT_VERSION}"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.version }}
          body: |
            ## Prepito ${{ steps.tag.outputs.version }}

            E2E暗号化メッセンジャーアプリ (Signal Protocol / X3DH + Double Ratchet)

            ### インストール

            - **Android**: `Prepito-android.apk` をダウンロードしてインストール
            - 未知のソースからのインストールを許可する必要があります

            ### ビルド情報

            - プラットフォーム: Android (APK)
            - ビルド方式: F-Droid と同じビルド手順 (fdroid/build-recipe.sh) + リリース署名
            - 暗号化: SQLite + SQLCipher (ローカルDB), Signal Protocol (E2E)
          draft: false
          prerelease: false
          reuse: true

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Prepito-android.apk
