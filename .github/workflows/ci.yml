name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: TypeCheck - root
        run: pnpm typecheck
      - name: TypeCheck - shared
        run: pnpm --filter @prepito/shared typecheck
      - name: TypeCheck - app
        run: pnpm --filter @prepito/app typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Lint - root
        run: pnpm lint
      - name: Lint - shared
        run: pnpm --filter @prepito/shared lint
      - name: Lint - app
        run: pnpm --filter @prepito/app lint
      # シェル変数参照の直後に全角文字があると、bash が変数名の一部に
      # 取り込んで `unbound variable` で停止する（原因が分かりにくい）。
      # ビルド前に静的検査で検出する。
      - name: Check shell variable references
        run: |
          python3 scripts/check-shell-vars.py \
            fdroid/build-recipe.sh \
            scripts/build-android.sh \
            .github/workflows/ci.yml \
            .github/workflows/release.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Test - shared
        run: pnpm --filter @prepito/shared test 2>/dev/null || echo "No tests in shared"
      - name: Test - app
        run: pnpm --filter @prepito/app test

  # F-Droid 掲載用ビルドの検証。
  # fdroid/com.prepito.app.yml のレシピと同じ手順を再現し、
  # F-Droid の組み込みポリシー (Firebase / GMS 禁止) を機械的に検証する。
  fdroid-build:
    name: Build App (F-Droid Recipe)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125"
          "$SDKMANAGER" --list_installed | grep -q "ndk;26.1.10909125" || {
            echo "::error::NDK 26.1.10909125 の導入に失敗しました"
            exit 1
          }
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
      # F-Droid の公式 firebase-stub srclib。expo-notifications の
      # com.google.firebase:firebase-messaging 依存を代替する。
      - name: Fetch firebase-stub (F-Droid srclib)
        env:
          FB_STUB_SHA: ce90a956aacda17a85c60577ee443aeb83d876ef
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-stub"
          curl -fsSL "https://gitlab.com/freed-by-fdroid/firebase-stubs/-/archive/${FB_STUB_SHA}/firebase-stubs-${FB_STUB_SHA}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/firebase-stub" --strip-components=1
          test -d "$RUNNER_TEMP/firebase-stub/firebase-messaging/src"
          echo "firebase-stub を展開しました"
      # ビルド準備は F-Droid サーバと同じスクリプト
      # （fdroid/build-recipe.sh）を実行する。
      # レシピと CI が単一の情報源を共有するため、
      # 「F-Droid 向け APK」と「GitHub Release 向け APK」のビルドが乖離しない。
      - name: Apply F-Droid build recipe (prebuild)
        env:
          FIREBASE_STUB_DIR: ${{ runner.temp }}/firebase-stub
          # versionCode は app.config.ts を単一の情報源とする。
          # F-Droid サーバ側ではレシピの metadata ($$VERCODE$$) が正となる。
          PREPITO_SIGNING_MODE: unsigned
        run: |
          set -euo pipefail
          VERCODE="$(grep -oE 'versionCode:[[:space:]]*[0-9]+' packages/app/app.config.ts | head -1 | grep -oE '[0-9]+')"
          test -n "$VERCODE" || { echo "::error::app.config.ts から versionCode を取得できません"; exit 1; }
          export VERCODE
          bash fdroid/build-recipe.sh
      # レシピと同じく Gradle ラッパーを使う（プロジェクトは Gradle 8.6 固定）
      - name: Gradle assembleRelease
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon
      # F-Droid の組み込みポリシーは Google Play Services / Firebase を禁じ、
      # ビルド成果 APK の versionCode が metadata と一致しなければビルドを失敗させる
      - name: Verify F-Droid compliance
        working-directory: packages/app
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK" || { echo "::error::APK が生成されていません: $APK"; exit 1; }
          unzip -l "$APK" > /dev/null

          # 1) Firebase / GMS などの NonFree な依存が残っていないこと
          #    fdroidserver の KnownNonFree 相当のパターンで判定する
          echo "--- release ランタイム依存に NonFree な依存がないこと ---"
          # レシピと同じく Gradle ラッパーを使う（プロジェクトは Gradle 8.6 固定）。
          # システム gradle を使うと版本不一致で失敗し、
          # 出力先が空になると下面的チェックが空振り（常に成功）してしまう。
          ( cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon ) \
            > /tmp/deps.txt 2>/tmp/deps.err || {
              echo "::error::releaseRuntimeClasspath の解決に失敗しました"
              tail -30 /tmp/deps.err
              exit 1
            }
          # 依存グラフが空だと NonFree チェックが常に成功してしまうため、
          # 取得できない場合は失敗させる
          if ! grep -q 'releaseRuntimeClasspath' /tmp/deps.txt; then
            echo "::error::依存グラフを取得できませんでした（deps.txt が空または不正）"
            wc -l /tmp/deps.txt
            exit 1
          fi
          # check-nonfree.py はリポジトリルートにある（このステップの cwd は packages/app）
          python3 ../../fdroid/check-nonfree.py /tmp/deps.txt

          # 2) 未署名であること（F-Droid 側で署名する）
          #    署名スキーム v2/v3 は META-INF/*.RSA を生成しないため、
          #    META-INF の有無ではなく apksigner で判定する
          APKSIGNER="$(ls -d "${ANDROID_HOME}/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            if "$APKSIGNER" verify "$APK" > /dev/null 2>&1; then
              echo "::error::APK が署名されています。F-Droid ビルドでは署名しないでください"
              exit 1
            fi
            echo "OK: 未署名（apksigner で確認）"
          else
            echo "::warning::apksigner が見つからないため apksigner による署名の検証をスキップします"
            # フォールバック: v1 (JAR) 署名由来の META-INF 署名ファイルの有無
            if unzip -l "$APK" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC|SF)$'; then
              echo "::error::APK が署名されています。F-Droid ビルドでは署名しないでください"
              exit 1
            fi
            echo "OK: 未署名（META-INF 検査）"
          fi

          # 3) package 名と versionCode が app.config.ts と一致すること
          AAPT="$(ls -d "${ANDROID_HOME}/build-tools/"*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging "$APK")"
            echo "$BADGING" | head -3
            echo "$BADGING" | grep -q "package: name='com.prepito.app'" \
              || { echo "::error::package 名が com.prepito.app ではありません"; exit 1; }
            EXPECTED_VERSIONCODE="$(grep -oE 'versionCode:[[:space:]]*[0-9]+' app.config.ts | head -1 | grep -oE '[0-9]+')"
            echo "$BADGING" | grep -q "versionCode='${EXPECTED_VERSIONCODE}'" \
              || { echo "::error::versionCode が app.config.ts (${EXPECTED_VERSIONCODE}) と一致しません"; exit 1; }
            echo "OK: package / versionCode 一致"
          else
            echo "::warning::aapt が見つからないため package / versionCode の検証をスキップします"
          fi

          # 4) Google Play Services のクラスが APK に含まれないこと
          if unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings | grep -q 'com/google/android/gms'; then
            echo "::error::APK に com/google/android/gms のクラスが含まれています"
            exit 1
          fi
          echo "OK: GMS クラスなし"
      - name: Upload F-Droid build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepito-fdroid-apk
          path: packages/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    outputs:
      changesets: ${{ steps.changeset.outputs.changesets }}
      published: ${{ steps.changeset.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Create Changeset
        id: changeset
        uses: changesets/action@v2
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: changeset
    if: needs.changeset.outputs.published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Publish to npm
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}