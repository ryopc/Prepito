name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: TypeCheck - root
        run: pnpm typecheck
      - name: TypeCheck - shared
        run: pnpm --filter @prepito/shared typecheck
      - name: TypeCheck - app
        run: pnpm --filter @prepito/app typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Lint - root
        run: pnpm lint
      - name: Lint - shared
        run: pnpm --filter @prepito/shared lint
      - name: Lint - app
        run: pnpm --filter @prepito/app lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Test - shared
        run: pnpm --filter @prepito/shared test 2>/dev/null || echo "No tests in shared"
      - name: Test - app
        run: pnpm --filter @prepito/app test

  build-app:
    name: Build App (Local EAS Build)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      # EAS CLI のバージョンを固定する。
      # ローカルビルドプラグインのバージョンは @expo/eas-build-job から導出するため、
      # eas-cli の内部構成が変わると導出に失敗しうるため pin する。
      - name: Install EAS CLI
        run: npm install -g eas-cli@25.2.0
      # EAS ローカルビルド用プラグインを事前導入する。
      # dtrace-provider (bunyan の optional 依存) はネイティブビルドが失敗すると
      # dtrace-provider.js が 0 バイトになり、プラグインが
      # "dtrace.createDTraceProvider is not a function" で TypeError する。
      # 除去すれば bunyan は既定実装へフォールバックするため、
      # OS やツールチェーンに依存せず確実にビルドできる。
      - name: Prepare EAS local build plugin
        run: |
          set -euo pipefail
          EAS_ROOT="$(npm root -g)/eas-cli"
          PLUGIN_VERSION="$(node -p "require('$EAS_ROOT/node_modules/@expo/eas-build-job/package.json').version" 2>/dev/null || node -p "require('$(npm root -g)/@expo/eas-build-job/package.json').version")"
          echo "EAS local build plugin version: $PLUGIN_VERSION"
          PLUGIN_DIR="$RUNNER_TEMP/eas-local-build-plugin"
          mkdir -p "$PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          npm init -y > /dev/null
          npm install --no-save "eas-cli-local-build-plugin@$PLUGIN_VERSION"
          find "$PLUGIN_DIR/node_modules" -type d -name 'dtrace-provider' -prune -exec rm -rf {} + 2>/dev/null || true
          echo "EAS_LOCAL_BUILD_PLUGIN_PATH=$PLUGIN_DIR/node_modules/eas-cli-local-build-plugin/bin/run" >> "$GITHUB_ENV"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ローカルビルドはホストの Android SDK を直接使うため、
      # プロジェクトが要求する NDK を明示的に導入する
      # (GitHub ランナー既定の NDK は 27/29/30 で 26.1.10909125 ではない)
      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125"
          "$SDKMANAGER" --list_installed | grep -q "ndk;26.1.10909125" || {
            echo "::error::NDK 26.1.10909125 の導入に失敗しました"
            exit 1
          }
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
      # EAS ローカルビルドは EAS サーバーに接続してプロジェクト存在を確認するため、
      # EXPO_TOKEN が未設定だと "An Expo user account is required to proceed." で失敗する。
      # トークンが無い環境でも APK のビルド検証は成立させるため、
      # ここではトークンの有無を判定し、無い場合は Gradle 直接ビルドへ切り替える。
      - name: Detect EXPO_TOKEN
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN が設定されているため EAS ローカルビルドを使用します"
            echo "mode=eas" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::EXPO_TOKEN が未設定のため Gradle 直接ビルドにフォールバックします"
            echo "mode=gradle" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify EAS project configuration
        if: steps.expo.outputs.mode == 'eas'
        working-directory: packages/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(npx expo config --json 2>/dev/null | jq -r '.extra.eas.projectId // ""')
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::EAS プロジェクトが未設定です。ローカルで \`EXPO_TOKEN=... eas init --force --non-interactive\` を実行し、app.config.ts の extra.eas.projectId に projectId を設定してください。"
            exit 1
          fi
          echo "EAS projectId: $PROJECT_ID"
      - name: Prebuild (config validation)
        working-directory: packages/app
        run: pnpm prebuild --clean
      # EAS のローカルビルドは EAS サーバーに接続してプロジェクト存在を確認するが、
      # ビルド処理自体はランナー上で実行されるため、ビルド時間を消費しない
      # --output は --local 専用の指定 (cwd 相対で解決されるため絶対パスを渡す)
      - name: EAS Build (local, Android)
        if: steps.expo.outputs.mode == 'eas'
        working-directory: packages/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --local --platform android --profile preview --non-interactive \
            --output "$GITHUB_WORKSPACE/build-output/prepito-android.apk"
      # EXPO_TOKEN 未設定時のフォールバック。
      # EAS の profile 設定（eas.json）を適用しない代わりに、
      # prebuild で android/ を生成し Gradle で直接ビルドする。
      - name: Gradle Build (fallback without EXPO_TOKEN)
        if: steps.expo.outputs.mode == 'gradle'
        working-directory: packages/app
        run: |
          set -euo pipefail
          npx expo prebuild -p android --clean
          ( cd android && ./gradlew assembleRelease --no-daemon )
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "$GITHUB_WORKSPACE/build-output/prepito-android.apk"
      - name: Verify APK
        run: |
          set -euo pipefail
          ls -lh build-output/
          # APK は zip コンテナであること
          unzip -l build-output/prepito-android.apk > /dev/null
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepito-android-apk
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 7

  # F-Droid 掲載用ビルドの検証。
  # fdroid/com.prepito.app.yml のレシピと同じ手順を再現し、
  # F-Droid の組み込みポリシー (Firebase / GMS 禁止) を機械的に検証する。
  fdroid-build:
    name: Build App (F-Droid Recipe)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125"
          "$SDKMANAGER" --list_installed | grep -q "ndk;26.1.10909125" || {
            echo "::error::NDK 26.1.10909125 の導入に失敗しました"
            exit 1
          }
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
      # F-Droid の公式 firebase-stub srclib。expo-notifications の
      # com.google.firebase:firebase-messaging 依存を代替する。
      - name: Fetch firebase-stub (F-Droid srclib)
        env:
          FB_STUB_SHA: ce90a956aacda17a85c60577ee443aeb83d876ef
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-stub"
          curl -fsSL "https://gitlab.com/freed-by-fdroid/firebase-stubs/-/archive/${FB_STUB_SHA}/firebase-stubs-${FB_STUB_SHA}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/firebase-stub" --strip-components=1
          test -d "$RUNNER_TEMP/firebase-stub/firebase-messaging/src"
          echo "firebase-stub を展開しました"
      # fdroid/com.prepito.app.yml の prebuild と同じ変換を適用する
      - name: Apply F-Droid build recipe (prebuild)
        run: |
          set -euo pipefail
          # node_modules は pnpm の hoisted 配置（node-linker=hoisted）のため
          # リポジトリルートにある。packages/app/node_modules は存在しない。
          # Firebase 実体への依存を除去し、スタブのソースを配置する
          sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
          cp -a "$RUNNER_TEMP/firebase-stub/firebase-messaging/src" node_modules/expo-notifications/android
          # Play Install Referrer Library (com.android.installreferrer) は
          # F-Droid の NonFree 判定対象。アプリでは未使用のため除去する。
          sed -i -e '/installreferrer/d' node_modules/expo-application/android/build.gradle
          sed -i -e '/com\.android\.installreferrer\.api/d' node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt
          sed -i -e '/AsyncFunction("getInstallReferrerAsync")/,/^    }$/d' node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt
          # 除去した Kotlin ソースの構文健全性を検証する
          # （sed の範囲削除が崩れるとコンパイルエラーになるため早期検出する）
          python3 -c "import sys;s=open('node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt').read();d=s.count('{')-s.count('}');sys.exit('ERROR unbalanced Kotlin braces ' + str(d)) if d else None"
          # プッシュ通知を無効化する（F-Droid は GMS / FCM を認めない）
          # APK に埋め込まれる assets/app.config は Gradle ビルド中の
          # createExpoConfig タスクが生成するため、ビルドフラグファイル
          # 経由で prebuild と Gradle ビルドの双方に伝える
          printf '{"enablePushNotifications":false}\n' > .build-flags.json
          (cd packages/app && EXPO_PUBLIC_ENABLE_PUSH=false npx expo prebuild -p android --clean)
          # versionCode を F-Droid の metadata 値に一致させる
          sed -i -e 's/^\([[:space:]]*\)versionCode .*/\1versionCode 1/' packages/app/android/app/build.gradle
          # 署名は F-Droid 側で行うため、開発用の署名設定を除去する
          sed -i -e '/signingConfig /d' packages/app/android/app/build.gradle
      # レシピと同じく Gradle ラッパーを使う（プロジェクトは Gradle 8.6 固定）
      - name: Gradle assembleRelease
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon
      # F-Droid の組み込みポリシーは Google Play Services / Firebase を禁じ、
      # ビルド成果 APK の versionCode が metadata と一致しなければビルドを失敗させる
      - name: Verify F-Droid compliance
        working-directory: packages/app
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK" || { echo "::error::APK が生成されていません: $APK"; exit 1; }
          unzip -l "$APK" > /dev/null

          # 1) Firebase / GMS などの NonFree な依存が残っていないこと
          #    fdroidserver の KnownNonFree 相当のパターンで判定する
          echo "--- release ランタイム依存に NonFree な依存がないこと ---"
          # レシピと同じく Gradle ラッパーを使う（プロジェクトは Gradle 8.6 固定）。
          # システム gradle を使うと版本不一致で失敗し、
          # 出力先が空になると下面的チェックが空振り（常に成功）してしまう。
          ( cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon ) \
            > /tmp/deps.txt 2>/tmp/deps.err || {
              echo "::error::releaseRuntimeClasspath の解決に失敗しました"
              tail -30 /tmp/deps.err
              exit 1
            }
          # 依存グラフが空だと NonFree チェックが常に成功してしまうため、
          # 取得できない場合は失敗させる
          if ! grep -q 'releaseRuntimeClasspath' /tmp/deps.txt; then
            echo "::error::依存グラフを取得できませんでした（deps.txt が空または不正）"
            wc -l /tmp/deps.txt
            exit 1
          fi
          # check-nonfree.py はリポジトリルートにある（このステップの cwd は packages/app）
          python3 ../../fdroid/check-nonfree.py /tmp/deps.txt

          # 2) 未署名であること（F-Droid 側で署名する）
          if unzip -l "$APK" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC|SF)$'; then
            echo "::error::APK が署名されています。F-Droid ビルドでは署名しないでください"
            exit 1
          fi
          echo "OK: 未署名"

          # 3) package 名と versionCode が app.config.ts と一致すること
          AAPT="$(ls -d "${ANDROID_HOME}/build-tools/"*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging "$APK")"
            echo "$BADGING" | head -3
            echo "$BADGING" | grep -q "package: name='com.prepito.app'" \
              || { echo "::error::package 名が com.prepito.app ではありません"; exit 1; }
            EXPECTED_VERSIONCODE="$(grep -oE 'versionCode:[[:space:]]*[0-9]+' app.config.ts | head -1 | grep -oE '[0-9]+')"
            echo "$BADGING" | grep -q "versionCode='${EXPECTED_VERSIONCODE}'" \
              || { echo "::error::versionCode が app.config.ts (${EXPECTED_VERSIONCODE}) と一致しません"; exit 1; }
            echo "OK: package / versionCode 一致"
          else
            echo "::warning::aapt が見つからないため package / versionCode の検証をスキップします"
          fi

          # 4) Google Play Services のクラスが APK に含まれないこと
          if unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings | grep -q 'com/google/android/gms'; then
            echo "::error::APK に com/google/android/gms のクラスが含まれています"
            exit 1
          fi
          echo "OK: GMS クラスなし"
      - name: Upload F-Droid build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepito-fdroid-apk
          path: packages/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    outputs:
      changesets: ${{ steps.changeset.outputs.changesets }}
      published: ${{ steps.changeset.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Create Changeset
        id: changeset
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: changeset
    if: needs.changeset.outputs.published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Publish to npm
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}