# ローカルで `fdroid build` を実行するための設定。
#
# ビルド可能な状態にするには fdroidserver が必要:
#   https://f-droid.org/docs/Building_Applications/
#
# F-Droid への提出用レシピは fdroid/com.prepito.app.yml に置く
# （fdroiddata リポジトリの metadata/com.prepito.app.yml に転記して使用する）。

Categories:
  - Communications

License: MIT
AuthorName: ryopc
AuthorEmail: game-ryo@ryopc.org

SourceCode: https://github.com/ryopc/Prepito
IssueTracker: https://github.com/ryopc/Prepito/issues

Builds:
  - versionName: 0.0.1
    versionCode: 1
    sudo:
      - apt-get update
      - apt-get install npm
      - npm -g install pnpm@9
    init:
      - pnpm install --frozen-lockfile
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    prebuild:
      # ビルド準備は単一の情報源 fdroid/build-recipe.sh に集約している。
      # fdroid/com.prepito.app.yml（提出用レシピ）と同じスクリプトを実行するため、
      # ローカルビルドと F-Droid サーバのビルドが乖離しない。
      - FIREBASE_STUB_DIR=$$firebase-stub$$ VERCODE=$$VERCODE$$ PREPITO_SIGNING_MODE=unsigned bash fdroid/build-recipe.sh
    output: packages/app/android/app/build/outputs/apk/release/app-release-unsigned.apk
    build:
      # Gradle ラッパー (gradlew) を使う。プロジェクトは
      # plugins/withGradleVersion で Gradle 8.6 に固定しており、
      # ビルドイメージのシステム Gradle に依存すると版本不一致で失敗する。
      - cd packages/app/android
      - ./gradlew assembleRelease --no-daemon
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules
